# Phuong an B (dac ta muc 10): Nginx + PHP-FPM (Laravel) + MariaDB + phpMyAdmin,
# kem worker queue, scheduler, Reverb. Chay trong Infra/: docker compose up -d --build

x-laravel: &laravel
  image: disaster-warning/app:${IMAGE_TAG:-local}
  build:
    context: ..
    dockerfile: Infra/docker/php/Dockerfile
    target: app
  restart: unless-stopped
  environment:
    APP_NAME: "Canh bao thien tai"
    APP_ENV: ${APP_ENV:-production}
    APP_KEY: ${APP_KEY:?Dat APP_KEY trong Infra/.env (xem Infra/README.md)}
    APP_DEBUG: ${APP_DEBUG:-false}
    APP_URL: ${APP_URL:-http://localhost:8000}
    APP_LOCALE: vi
    FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
    LOG_CHANNEL: stderr
    LOG_LEVEL: ${LOG_LEVEL:-info}

    DB_CONNECTION: mariadb
    DB_HOST: db
    DB_PORT: 3306
    DB_DATABASE: ${DB_DATABASE:-disaster_warning}
    DB_USERNAME: ${DB_USERNAME:-dws}
    DB_PASSWORD: ${DB_PASSWORD:?Dat DB_PASSWORD trong Infra/.env}

    SESSION_DRIVER: database
    CACHE_STORE: database
    QUEUE_CONNECTION: database
    FILESYSTEM_DISK: public

    BROADCAST_CONNECTION: reverb
    REVERB_APP_ID: ${REVERB_APP_ID:-dws}
    REVERB_APP_KEY: ${REVERB_APP_KEY:?Dat REVERB_APP_KEY trong Infra/.env}
    REVERB_APP_SECRET: ${REVERB_APP_SECRET:?Dat REVERB_APP_SECRET trong Infra/.env}
    # Server-side publish goes straight to the reverb container; browsers connect via nginx /app/.
    REVERB_HOST: reverb
    REVERB_PORT: 8080
    REVERB_SCHEME: http
    REVERB_SERVER_HOST: 0.0.0.0
    REVERB_SERVER_PORT: 8080

    MAIL_MAILER: ${MAIL_MAILER:-log}
    MAIL_HOST: ${MAIL_HOST:-}
    MAIL_PORT: ${MAIL_PORT:-587}
    MAIL_USERNAME: ${MAIL_USERNAME:-}
    MAIL_PASSWORD: ${MAIL_PASSWORD:-}
    MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-noreply@example.com}

    OPEN_METEO_URL: ${OPEN_METEO_URL:-https://api.open-meteo.com/v1/forecast}
    USGS_FEED_URL: ${USGS_FEED_URL:-https://earthquake.usgs.gov/fdsnws/event/1/query}
    ORS_API_KEY: ${ORS_API_KEY:-}
    RAIN_ALERT_THRESHOLD_MM: ${RAIN_ALERT_THRESHOLD_MM:-100}
  volumes:
    - storage:/var/www/html/storage
  depends_on:
    migrate:
      condition: service_completed_successfully

services:
  db:
    image: ${MARIADB_IMAGE:-mariadb:10.4.32}
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_DATABASE:-disaster_warning}
      MARIADB_USER: ${DB_USERNAME:-dws}
      MARIADB_PASSWORD: ${DB_PASSWORD:?Dat DB_PASSWORD trong Infra/.env}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Dat DB_ROOT_PASSWORD trong Infra/.env}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes:
      - db-data:/var/lib/mysql
    ports:
      # Only on localhost; 3307 avoids clashing with XAMPP's 3306.
      - "127.0.0.1:${DB_HOST_PORT:-3307}:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MARIADB_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

  # One-shot: runs migrations, then the long-running services start.
  migrate:
    <<: *laravel
    restart: "no"
    command: ["php", "artisan", "migrate", "--force"]
    depends_on:
      db:
        condition: service_healthy

  app:
    <<: *laravel

  queue:
    <<: *laravel
    command: ["php", "artisan", "queue:work", "--tries=3", "--backoff=10", "--max-time=3600"]

  scheduler:
    <<: *laravel
    command: ["php", "artisan", "schedule:work"]

  reverb:
    <<: *laravel
    command: ["php", "artisan", "reverb:start", "--host=0.0.0.0", "--port=8080"]

  nginx:
    image: disaster-warning/web:${IMAGE_TAG:-local}
    build:
      context: ..
      dockerfile: Infra/docker/php/Dockerfile
      target: web
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8000}:80"
    volumes:
      - storage:/var/www/html/storage:ro
    depends_on:
      - app
      - reverb

  phpmyadmin:
    image: phpmyadmin:5.2
    restart: unless-stopped
    environment:
      PMA_HOST: db
      UPLOAD_LIMIT: 64M
    ports:
      - "127.0.0.1:${PMA_PORT:-8081}:80"
    depends_on:
      db:
        condition: service_healthy

  # Phuong an A: link cong khai khi demo (quick tunnel, khong can tai khoan).
  # docker compose --profile tunnel up -d, roi xem URL: docker compose logs tunnel
  tunnel:
    image: cloudflare/cloudflared:${CLOUDFLARED_VERSION:-2024.12.2}
    profiles: ["tunnel"]
    restart: unless-stopped
    command: ["tunnel", "--no-autoupdate", "--url", "http://nginx:80"]
    depends_on:
      - nginx

volumes:
  db-data:
  storage:
