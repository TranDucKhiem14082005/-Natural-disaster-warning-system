map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    root /var/www/html/public;
    index index.php;

    # Report uploads: 5 files x 20MB.
    client_max_body_size 110M;

    # Behind cloudflared / another proxy on the Docker network: use the real client IP,
    # otherwise the SOS / auth rate limits (per IP) would hit every user at once.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # Uploaded media (Storage::disk('public')), shared volume with the app container.
    location /storage/ {
        alias /var/www/html/storage/app/public/;
        access_log off;
        expires 7d;
    }

    # Laravel Reverb (Pusher protocol): ws://<host>/app/<key>
    location /app/ {
        proxy_pass http://reverb:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
    }

    # Laravel: REST API, broadcasting auth (/api/broadcasting/auth), health check.
    location ~ ^/(api/|up$) {
        try_files $uri /index.php?$query_string;
    }

    # React SPA (client-side routing -> index.html).
    location / {
        root /var/www/html/spa;
        try_files $uri /index.html;
    }

    location /assets/ {
        root /var/www/html/spa;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location ~ \.php$ {
        fastcgi_pass app:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTP_PROXY "";
        fastcgi_read_timeout 60s;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}
