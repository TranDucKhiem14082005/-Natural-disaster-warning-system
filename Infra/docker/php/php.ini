expose_php = Off
memory_limit = 256M

; Reports: up to 5 files x 20MB (ReportController)
upload_max_filesize = 20M
post_max_size = 110M
max_file_uploads = 10

opcache.enable = 1
opcache.enable_cli = 1
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
